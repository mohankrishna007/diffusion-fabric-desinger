# Pipeline configuration
# Manufacturing constraints and default settings for the fabric design pipeline

pipeline:
  name: "Diffusion Fabric Designer"
  version: "1.0.0"

# Global manufacturing constraints
manufacturing:
  min_line_width_pixels: 2
  max_color_count: 16
  max_image_width: 10000
  max_image_height: 10000
  border_tolerance_pixels: 0  # Zero tolerance for repeat boundaries
  
# Image processing defaults
image:
  default_dpi: 300
  color_space: "RGB"
  # LOSSLESS FORMATS ONLY - JPEG forbidden per manufacturing mandate
  # Lossy compression destroys thread-level precision needed for CAM export
  supported_formats:
    - ".bmp"
    - ".png"
    - ".tiff"
    - ".tif"
  output_format: ".bmp"

# Canonical raster standards (normalization target)
canonical_raster:
  # DPI enforcement - normalization will rescale pixels to match this canonical DPI
  canonical_dpi: 300
  
  # Hybrid storage threshold - images larger than this are saved to .npy file
  # Smaller images stored in-memory as NumPy arrays
  memory_threshold_mb: 50
  
  # Color mode normalization target
  color_mode: "RGB"
  
  # Bit depth normalization target (per channel)
  bit_depth: 8
  
  # Alpha channel handling policy
  # Options: FLATTEN_WHITE (composite on white), FLATTEN_BLACK (composite on black), STRIP (remove alpha)
  alpha_policy: "FLATTEN_WHITE"
  
  # ICC color profile handling - strip embedded profiles for deterministic color interpretation
  strip_icc_profile: true
  
  # Resampling algorithm for DPI rescaling
  # Options: LANCZOS (high quality), BICUBIC, BILINEAR, NEAREST (preserve exact pixels)
  resampling_method: "LANCZOS"

# Dynamic stage configuration
# Stages are executed in the order defined here
# Each stage can declare dependencies on previous stages
stages:
  - id: "input_acquisition"
    name: "Input Acquisition"
    class_name: "InputAcquisitionStage"
    enabled: true
    dependencies: []
    config:
      timeout_seconds: 60
      # Note: Validation limits (DPI, dimensions, file size) are defined in
      # src/weaver/shared/constants.py as immutable manufacturing constraints
    
  - id: "canonical_normalization"
    name: "Canonical Normalization"
    class_name: "CanonicalNormalizationStage"
    enabled: true
    dependencies: ["input_acquisition"]
    config:
      timeout_seconds: 120
      target_dpi: 300
    
  - id: "structural_intent"
    name: "Structural Intent Definition"
    class_name: "StructuralIntentStage"
    enabled: true
    dependencies: ["canonical_normalization"]
    config:
      timeout_seconds: 180
      edge_detection_method: "canny"
      canny_threshold1: 50
      canny_threshold2: 150
    
  - id: "diffusion_refinement"
    name: "Controlled Diffusion Refinement"
    class_name: "DiffusionRefinementStage"
    enabled: true
    dependencies: ["structural_intent"]
    config:
      timeout_seconds: 1800  # 30 minutes
      denoise_strength: 0.3  # Low to preserve structure
      model: "stable-diffusion-v1.5"
      use_controlnet: true
    
  - id: "repeat_enforcement"
    name: "Repeat & Boundary Enforcement"
    class_name: "RepeatEnforcementStage"
    enabled: true
    dependencies: ["diffusion_refinement"]
    config:
      timeout_seconds: 120
      border_tolerance: 0  # Zero tolerance
    
  - id: "geometry_cleanup"
    name: "Manufacturing Geometry Cleanup"
    class_name: "GeometryCleanupStage"
    enabled: true
    dependencies: ["repeat_enforcement"]
    config:
      timeout_seconds: 180
      min_feature_width: 2
      morphology_kernel_size: 3
      remove_islands: true
    
  - id: "color_constraint"
    name: "Color & Thread Constraint Enforcement"
    class_name: "ColorConstraintStage"
    enabled: true
    dependencies: ["geometry_cleanup"]
    config:
      timeout_seconds: 120
      max_colors: 16
      quantization_method: "kmeans"
    
  - id: "precam_validation"
    name: "Pre-CAM Validation Firewall"
    class_name: "PreCAMValidationStage"
    enabled: true
    dependencies: ["color_constraint"]
    config:
      timeout_seconds: 60
      zero_tolerance: true

# Logging configuration
logging:
  level: "INFO"
  format: "structured"
  output: "console"
